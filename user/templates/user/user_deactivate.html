{% extends 'main.html' %}
{% block content %}

<div class="page-wrapper">

  <div class="page-header">
    <div class="page-header-left">
      <h1 class="page-title" style="color:var(--danger);">Deactivate Account</h1>
      <p class="page-subtitle">You are about to deactivate this user account</p>
    </div>
  </div>

  <div class="card" style="max-width:620px; margin:0 auto;">
    <div class="card-body">

      {% include 'user/partials/_user_deactivate_body.html' %}

      <form method="POST" action="{% url 'user-deactivate' user_id=user.id slug=user.slug %}">
        {% csrf_token %}
        <div class="mf-form-actions" style="margin-top:1.25rem;">
          <a href="{% url 'user-profile' user_id=user.id slug=user.slug %}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-person-slash"></i> Deactivate
          </button>
        </div>
      </form>

    </div>
  </div>

</div>

{% endblock content %}
